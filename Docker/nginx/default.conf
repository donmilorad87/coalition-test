server {
	listen 80;
	server_name coalitiontest.local;
	root /var/www/html;
	index index.php;
	client_max_body_size 64M;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	# Regex locations match in file order: these denies must stay above the PHP handler.
	location ~ /\.(?!well-known) {
		deny all;
	}

	# WP_DEBUG_LOG writes wp-content/debug.log; logs must never be downloadable.
	location ~* \.log$ {
		deny all;
	}

	# Uploads are data, never code.
	location ~* ^/wp-content/uploads/.*\.php$ {
		deny all;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_pass php:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	}

	location ~* \.(css|js|mjs|woff2|svg|png|jpe?g|webp|ico)$ {
		expires 30d;
		access_log off;
		try_files $uri =404;
	}
}
